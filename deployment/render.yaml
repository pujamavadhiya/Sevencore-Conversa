services:
  # Backend Web API Service
  - type: web
    name: sevencore-conversa-backend
    env: python
    region: singapore # Closest low-latency region to India
    plan: starter
    buildCommand: "cd backend && pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: sevencore-conversa-postgres
          property: connectionString
      - key: SARVAM_USE_MOCK
        value: "False" # Set to False in production once credentials are confirmed
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_ORG_ID
        sync: false
      - key: SARVAM_WORKSPACE_ID
        sync: false
      - key: SARVAM_CONNECTION_ID
        sync: false
      - key: SARVAM_AGENT_PHONE_NUMBER
        sync: false
      - key: SARVAM_WEBHOOK_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "https://sevencore-conversa.vercel.app"

databases:
  - name: sevencore-conversa-postgres
    plan: standard # Managed PostgreSQL for reliable production calling
    region: singapore
